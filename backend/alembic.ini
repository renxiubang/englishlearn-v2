[alembic]
script_location = alembic
prepend_sys_path = .
# URL is injected by env.py from app settings (.env DB_URL); keep empty here
# NOTE: keep this file ASCII-only - alembic reads it with the Windows locale
# encoding (GBK), non-ASCII bytes break `alembic upgrade` on Windows
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
